name: Google Meet connector

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/macle_meet/**"
      - "tests/**"
      - "connectors/google-meet/**"
      - ".github/workflows/google-meet-connector.yml"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "src/macle_meet/**"
      - "tests/**"
      - "connectors/google-meet/**"
      - ".github/workflows/google-meet-connector.yml"

concurrency:
  group: google-meet-connector-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Run unit tests
        run: pytest -q

  chrome-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check extension JavaScript syntax
        run: |
          node --check connectors/google-meet/chrome-extension/service-worker.js
          node --check connectors/google-meet/chrome-extension/offscreen.js
          node --check connectors/google-meet/chrome-extension/options.js
      - name: Validate extension manifest
        run: python -c "import json; json.load(open('connectors/google-meet/chrome-extension/manifest.json', encoding='utf-8'))"
