name: MACLE prototype builds

on:
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "core/**"
      - "apps/android/**"
      - "connectors/google-meet/chrome-extension/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/macle-prototype-builds.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "core/**"
      - "apps/android/**"
      - "connectors/google-meet/chrome-extension/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/macle-prototype-builds.yml"

permissions:
  contents: read

concurrency:
  group: macle-prototype-builds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chrome:
    name: Chrome extension and shared Rust/WASM core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WebAssembly packager and ZIP
        run: |
          cargo install wasm-pack --locked
          sudo apt-get update
          sudo apt-get install --yes zip
      - name: Run native shared-core tests
        run: cargo test --workspace
      - name: Build, test and package Chrome extension
        run: sh scripts/package-chrome-extension.sh
      - name: Upload Chrome extension package
        uses: actions/upload-artifact@v4
        with:
          name: macle-chrome-extension
          path: dist/macle-chrome-extension.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android arm64 debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Android SDK platform and NDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Android debug APK
        run: sh scripts/build-android-apk.sh
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: macle-android-debug
          path: dist/MACLE-android-debug.apk
          if-no-files-found: error
          retention-days: 14
