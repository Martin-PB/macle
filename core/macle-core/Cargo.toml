[package]
name = "macle-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Platform-independent MACLE session and observation contract implementation"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
hex = "0.4"
