[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "macle-meet"
version = "0.1.0"
description = "Local, single-device Google Meet metadata and artifact collector for MACLE"
readme = "connectors/google-meet/README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "google-auth>=2.35,<3",
  "google-auth-oauthlib>=1.2,<2",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
asr = ["faster-whisper>=1.2.1,<2"]

[project.scripts]
macle-meet = "macle_meet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
